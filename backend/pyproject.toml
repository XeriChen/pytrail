[project]
name = "pytrail-api"
version = "1.0.0"
description = "FastAPI backend for the PyTrail Python learning platform"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "sqlalchemy==2.0.52",
  "python-jose[cryptography]==3.5.0",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
  "httpx2==2.10.0",
]

[tool.uv]
package = false
