name: Desktop Release

# 构建 → 测试 → 打包 Windows 桌面版（PyInstaller onedir）→ 发布 Release。
#
# 触发方式：
#   - 推送 v* 标签（例如 `git tag v1.2.0 && git push origin v1.2.0`）：
#     跑完整流水线，并在最后创建/更新对应的 GitHub Release，
#     附上 PyTrail-<标签>-win-x64.zip 与 SHA256 校验文件。
#   - Actions 页面手工触发：跑同样的构建与冒烟测试并保留 workflow artifact；
#     勾选 release 且填写 version 时额外创建 Release。
#
# 与 .cnb.yml 的关系：两者执行同一套命令
# （pnpm build → uv sync --locked → pyinstaller pytrail_desktop.spec），
# 区别是 GitHub 托管的 windows-latest 自带 Windows 构建机，无需自托管 Runner。
#
# 注意：标签推送不会触发 ci.yml（它只过滤 main 分支），因此本流水线自带
# 与 ci.yml 相同的后端、前端检查，作为发布前的质量门。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '产物版本号，用作 zip 文件名与 Release 标签（例如 v1.2.0）；留空时使用 dev-<短 commit>'
        required: false
        type: string
      release:
        description: '构建完成后创建或更新 GitHub Release（必须同时填写 version）'
        required: false
        type: boolean
        default: false

# 默认只读；只有 release 任务需要写权限（创建 Release 与上传附件）。
permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run python -m compileall app
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -c "from fastapi.testclient import TestClient; from app.main import app; c=TestClient(app); c.__enter__(); assert c.get('/api/health').status_code == 200; assert c.get('/api/courses').status_code == 200; c.__exit__(None, None, None)"

  frontend-tests:
    name: frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  package-windows:
    name: package windows app
    runs-on: windows-latest
    timeout-minutes: 40
    needs: [backend-tests, frontend-tests]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
          enable-cache: true

      - name: Resolve package version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:DISPATCH_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          }
          if (-not $version) {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          # 文件名与 artifact 名称不能含路径分隔符等字符，统一收敛到安全集合。
          $safe = $version -replace '[^A-Za-z0-9._-]', '-'
          "version=$safe" >> $env:GITHUB_OUTPUT
          Write-Output "package version: $safe"

      - name: Build frontend bundle
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync backend environment
        working-directory: backend
        run: uv sync --locked

      - name: Build desktop bundle
        working-directory: backend
        run: uv run pyinstaller pytrail_desktop.spec --noconfirm

      - name: Verify packaged bundle
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'dist/PyTrail/PyTrail.exe'
          $bundle = Split-Path -Parent $exe.Path

          # PyInstaller 6 的 onedir 把 datas 放在 dist/PyTrail/_internal（即 sys._MEIPASS）。
          $web = Get-ChildItem $bundle -Recurse -Directory -Filter 'web' | Select-Object -First 1
          if (-not $web -or -not (Test-Path (Join-Path $web.FullName 'index.html'))) {
            throw 'Bundled frontend bundle (frontend/dist -> web/index.html) is missing'
          }
          $content = Get-ChildItem $bundle -Recurse -Directory -Filter 'python-100-days' | Select-Object -First 1
          if (-not $content) { throw 'Bundled course content is missing' }
          $courses = (Get-ChildItem $content.FullName -Directory).Count
          if ($courses -lt 9) { throw "Expected 9 course folders, found $courses" }
          $practice = Get-ChildItem $bundle -Recurse -Directory -Filter 'practice' | Select-Object -First 1
          if (-not $practice) { throw 'Bundled practice manifests are missing' }
          $manifests = @(Get-ChildItem $practice.FullName -Filter '*.json')
          if ($manifests.Count -lt 9) {
            throw "Expected 9 practice manifests, found $($manifests.Count)"
          }
          Write-Output "bundle ok: $courses courses, $($manifests.Count) practice manifests"

      - name: Smoke test frozen practice worker
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          # 管道默认可能带 UTF-8 BOM，会让 worker 的 json.loads 直接报错。
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          # 桌面版练习运行复用 exe 自身的 --pytrail-practice-worker 分支；
          # 这里直接以 JSON stdio 协议驱动它，验证冻结 worker 可用。
          $payload = @{
            code            = "def add(a, b):`n    return a + b`n"
            function_name   = 'add'
            parameter_names = @('a', 'b')
            cases           = @(
              @{ args = @(1, 2); kwargs = @{}; expected = 3; comparison = 'exact'; tolerance = 1e-6 },
              @{ args = @(-1, 1); kwargs = @{}; expected = 0; comparison = 'exact'; tolerance = 1e-6 }
            )
          } | ConvertTo-Json -Depth 8 -Compress

          $raw = $payload | & ./dist/PyTrail/PyTrail.exe --pytrail-practice-worker
          if ($LASTEXITCODE -ne 0) { throw "worker exited with $LASTEXITCODE" }
          $result = ($raw | Out-String) | ConvertFrom-Json
          if (-not $result.ok -or -not $result.passed -or $result.passed_count -ne 2) {
            throw "frozen practice worker failed: $($raw | Out-String)"
          }
          Write-Output "frozen worker ok: $($result.passed_count)/$($result.total_count) cases passed"

      - name: Smoke test desktop bundle
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          # 用隔离的 APPDATA 启动，确保是全新数据库与全新内容同步。
          $appData = Join-Path $env:RUNNER_TEMP 'pytrail-smoke-appdata'
          Remove-Item $appData -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $appData | Out-Null
          $env:APPDATA = $appData
          $store = Join-Path $appData 'PyTrail'

          $exe = (Resolve-Path 'dist/PyTrail/PyTrail.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            # server.json 只有健康检查通过后才会写入，出现即代表 API 与内容同步就绪。
            $serverFile = Join-Path $store 'server.json'
            $deadline = (Get-Date).AddSeconds(180)
            while (-not (Test-Path $serverFile) -and (Get-Date) -lt $deadline) {
              if ($process.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path $serverFile)) {
              $log = Join-Path $store 'desktop.log'
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              throw 'PyTrail.exe did not start its API in time'
            }

            $server = Get-Content $serverFile -Raw | ConvertFrom-Json
            $base = "http://127.0.0.1:$($server.port)"

            $health = Invoke-RestMethod "$base/api/health"
            if ($health.status -ne 'ok') { throw 'Unexpected /api/health payload' }

            $config = Invoke-RestMethod "$base/api/config"
            if (-not $config.local_mode) { throw 'The packaged app did not enable local mode' }

            $courses = @(Invoke-RestMethod "$base/api/courses")
            if ($courses.Count -lt 9) { throw "Expected 9 courses, got $($courses.Count)" }

            $index = Invoke-WebRequest "$base/"
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch 'id="root"') {
              throw 'The bundled web app is not served'
            }
            if (-not (Test-Path (Join-Path $store 'learning.db'))) {
              throw 'learning.db was not created'
            }

            Write-Output "desktop smoke test ok: port $($server.port), $($courses.Count) courses"
          } finally {
            if (-not $process.HasExited) { taskkill /PID $process.Id /T /F 2>&1 | Out-Null }
          }

      - name: Package distribution zip
        working-directory: backend
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $package = "PyTrail-$version-win-x64.zip"
          Compress-Archive -Path 'dist/PyTrail/*' -DestinationPath "dist/$package" -Force
          $hash = (Get-FileHash "dist/$package" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package" | Out-File "dist/$package.sha256" -Encoding ascii
          Get-Item "dist/$package" | ForEach-Object {
            Write-Output "$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB) sha256=$hash"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pytrail-win-x64
          path: |
            backend/dist/PyTrail-*.zip
            backend/dist/PyTrail-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
          # zip 已经压缩过，artifact 直接存储，避免二次压缩浪费时间。
          compression-level: 0

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [package-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytrail-win-x64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          # 手工触发时标签还不存在，需要显式指向当前 commit；标签触发时留空。
          TARGET_SHA: ${{ github.ref_type == 'tag' && '' || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::workflow_dispatch 创建 Release 需要填写 version 输入"
            exit 1
          fi
          cd dist
          ls -l
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip ./*.zip.sha256 --clobber
          elif [ -n "$TARGET_SHA" ]; then
            gh release create "$TAG" ./*.zip ./*.zip.sha256 \
              --title "PyTrail $TAG" --generate-notes --target "$TARGET_SHA"
          else
            gh release create "$TAG" ./*.zip ./*.zip.sha256 \
              --title "PyTrail $TAG" --generate-notes
          fi
